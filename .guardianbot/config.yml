schemaVersion: 1.0.0
workflowVersion: 7524547700e4c3994353f5c61d1625b2bd5e5428
repository:
  defaultBranch: main
  releaseBranches:
    - main
  languages:
    - makefile
    - python
    - shell
    - swift
  relatedRepositories: []
review:
  automatic: true
  drafts: manual
  incremental: true
  maxInlineComments: 8
  categories:
    - security
    - logic
    - reliability
    - concurrency
    - performance
    - contract
    - testing
  highRiskPaths:
    - "**/auth/**"
    - "**/security/**"
    - "**/migrations/**"
    - .github/workflows/**
    - "**/Dockerfile*"
    - "**/*secret*"
    - "**/*tenant*"
  contextDocuments:
    - README.md
    - CONTRIBUTING.md
    - SECURITY.md
    - .github/CODEOWNERS
  excludedPaths:
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.min.js"
scanners:
  mode: report-only
  semgrep: true
  trivy: true
  suppressions: []
image: null
dast: null
